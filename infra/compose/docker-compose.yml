name: accordo

# Apps run on the host with `pnpm dev`; Docker provides only the backing services.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: accordo
      POSTGRES_PASSWORD: accordo
      POSTGRES_DB: accordo
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql # PostgreSQL 18+ image uses this path
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accordo -d accordo"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8.1.11-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.56.0
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev_master_key_change_me_please}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports: ["7700:7700"]
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:7700/health || wget -qO- http://localhost:7700/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-accordo}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-accordo-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - s3data:/data

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports: ["1025:1025", "8025:8025"]

  stripe-cli:
    image: stripe/stripe-cli:v1.55.3
    profiles: ["stripe"]
    command: ["listen", "--forward-to", "http://host.docker.internal:4000/api/v1/webhooks/stripe"]
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  meilidata:
  s3data:

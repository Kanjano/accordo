# Staging deploy (SPEC §15.4): images to GHCR, then on the VM `migrate` first and the rollout after.
# Needs the "staging" environment with: vars STAGING_DOMAIN, NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY,
# NEXT_PUBLIC_TURNSTILE_SITE_KEY; secrets STAGING_HOST, STAGING_USER, STAGING_SSH_KEY; and the
# repository variable STAGING_ENABLED=true (otherwise the workflow is skipped).
# On the VM, /opt/accordo holds docker-compose.prod.example.yml, caddy/, postgres/ and .env.prod.
name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    # Repository variable STAGING_ENABLED=true once the server exists; until then the job is skipped.
    if: vars.STAGING_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      matrix:
        target: [web, api, worker, migrate]
    steps:
      - uses: actions/checkout@v5
      # Registry paths must be lowercase; the owner name may not be.
      - id: repo
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.repo.outputs.name }}/${{ matrix.target }}:${{ github.sha }}
            ${{ steps.repo.outputs.name }}/${{ matrix.target }}:staging
          build-args: |
            API_URL=https://api.${{ vars.STAGING_DOMAIN }}
            WEB_URL=https://${{ vars.STAGING_DOMAIN }}
            MEDIA_PUBLIC_URL=https://s3.${{ vars.STAGING_DOMAIN }}/accordo-media
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  rollout:
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Migrate, then roll out
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          TARGET: ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}
          TAG: ${{ github.sha }}
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          install -m 600 /dev/null key && echo "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$TARGET" "
            set -e; cd /opt/accordo
            export COMPOSE='docker compose -f docker-compose.prod.example.yml --env-file .env.prod'
            for t in web api worker migrate; do docker pull $REPO/\$t:$TAG && docker tag $REPO/\$t:$TAG accordo-\$t; done
            \$COMPOSE run --rm migrate
            \$COMPOSE up -d --no-build --remove-orphans
            \$COMPOSE ps"
